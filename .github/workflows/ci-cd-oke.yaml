name: CI/CD to OCI OKE (mandelbrok8s)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-k8s-manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install manifest test dependencies
        run: python -m pip install --disable-pip-version-check -r k8s/tests/tests-mandelbrok8s-k8s-requirements

      - name: Run Kubernetes manifest tests
        run: python -m unittest discover -s k8s/tests -p "test_*.py" -v

  preflight:
    name: Pre-deployment connectivity checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-k8s-manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required GitHub secrets are configured
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_CLUSTER_OCID: ${{ secrets.OCI_CLUSTER_OCID }}
        run: |
          set -euo pipefail
          for secret_name in DOCKER_USERNAME DOCKER_PASSWORD OCI_USER_OCID OCI_TENANCY_OCID OCI_REGION OCI_FINGERPRINT OCI_PRIVATE_KEY OCI_CLUSTER_OCID; do
            if [[ -z "$(printenv "$secret_name")" ]]; then
              echo "::error::Required GitHub secret $secret_name is missing."
              exit 1
            fi
          done

      - name: Verify Docker Hub authentication
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Install OCI CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh -o install.sh
          bash install.sh --accept-all-defaults
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure OCI credentials
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"
          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          EOF

      - name: Configure kubeconfig and verify cluster connectivity
        env:
          OCI_CLUSTER_OCID: ${{ secrets.OCI_CLUSTER_OCID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          export KUBECONFIG="$HOME/.kube/config"
          oci ce cluster create-kubeconfig \
            --cluster-id "$OCI_CLUSTER_OCID" \
            --file "$KUBECONFIG" \
            --region "$OCI_REGION" \
            --token-version 2.0.0 \
            --kube-endpoint PUBLIC_ENDPOINT
          echo "KUBECONFIG=$KUBECONFIG" >> "$GITHUB_ENV"
          kubectl cluster-info

      - name: Verify namespace and preflight permissions
        run: |
          set -euo pipefail
          namespace="mandelbrok8s"
          kubectl get namespace "$namespace" >/dev/null
          for permission in "get secrets" "create jobs.batch" "get jobs.batch" "delete jobs.batch" "get pods" "get pods/log"; do
            read -r verb resource <<< "$permission"
            if ! kubectl auth can-i --quiet "$verb" "$resource" -n "$namespace"; then
              echo "::error::Kubernetes credentials cannot $verb $resource in namespace $namespace."
              exit 1
            fi
          done

          for resource in deployments.apps services ingresses.networking.k8s.io horizontalpodautoscalers.autoscaling serviceaccounts roles.rbac.authorization.k8s.io rolebindings.rbac.authorization.k8s.io; do
            for verb in create patch; do
              if ! kubectl auth can-i --quiet "$verb" "$resource" -n "$namespace"; then
                echo "::error::Kubernetes credentials cannot $verb $resource in namespace $namespace."
                exit 1
              fi
            done
          done

          for resource in clusterroles.rbac.authorization.k8s.io clusterrolebindings.rbac.authorization.k8s.io; do
            for verb in create patch; do
              if ! kubectl auth can-i --quiet "$verb" "$resource"; then
                echo "::error::Kubernetes credentials cannot $verb $resource."
                exit 1
              fi
            done
          done

          if ! kubectl auth can-i --quiet patch namespaces; then
            echo "::error::Kubernetes credentials cannot patch namespaces."
            exit 1
          fi

      - name: Verify required Kubernetes Secrets
        run: |
          set -euo pipefail
          namespace="mandelbrok8s"
          if ! kubectl get secret mongo-secrets -n "$namespace" -o json \
            | jq -e '.type == "Opaque" and (.data.MONGO_URI | type == "string" and length > 0)' >/dev/null; then
            echo "::error::mongo-secrets is missing or has no non-empty MONGO_URI key."
            exit 1
          fi
          if ! kubectl get secret tls-secrets -n "$namespace" -o json \
            | jq -e '.type == "kubernetes.io/tls" and (.data["tls.crt"] | type == "string" and length > 0) and (.data["tls.key"] | type == "string" and length > 0)' >/dev/null; then
            echo "::error::tls-secrets is missing or has no non-empty tls.crt and tls.key keys."
            exit 1
          fi

      - name: Verify MongoDB connectivity from Kubernetes
        timeout-minutes: 3
        run: |
          set -euo pipefail
          namespace="mandelbrok8s"
          job_name="mongo-connectivity-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup() {
            kubectl delete job "$job_name" -n "$namespace" --ignore-not-found=true --wait=false >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          kubectl apply -f - <<YAML
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: $job_name
            namespace: $namespace
            labels:
              app.kubernetes.io/name: mongo-connectivity-preflight
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: 90
            ttlSecondsAfterFinished: 60
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: mongo-ping
                    image: mongo:8.0
                    imagePullPolicy: IfNotPresent
                    command: ["/bin/sh", "-ec"]
                    args:
                      - |
                        if mongosh "\$MONGO_URI" --quiet --eval 'if (db.runCommand({ ping: 1 }).ok !== 1) quit(1)' >/dev/null 2>&1; then
                          echo "MongoDB connectivity check succeeded."
                        else
                          echo "MongoDB connectivity check failed; details suppressed." >&2
                          exit 1
                        fi
                    env:
                      - name: MONGO_URI
                        valueFrom:
                          secretKeyRef:
                            name: mongo-secrets
                            key: MONGO_URI
          YAML
          if ! kubectl wait --for=condition=complete "job/$job_name" -n "$namespace" --timeout=100s; then
            kubectl logs "job/$job_name" -n "$namespace" --all-containers=true || true
            echo "::error::MongoDB connectivity preflight failed or timed out."
            exit 1
          fi
          kubectl logs "job/$job_name" -n "$namespace" --all-containers=true

  build-and-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate-k8s-manifests, preflight]
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx for optimized multi-arch builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Log in to Docker Hub securely
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Build Orchestrator TypeScript code
      - name: Build Orchestrator
        run: |
          cd app/orchestrator
          npm ci
          npm run build
          cd ../..

      # 5. Build Worker TypeScript code
      - name: Build Worker
        run: |
          cd app/worker
          npm ci
          npm run build
          cd ../..

      # 6. Build and push Multi-Arch Orchestrator image
      - name: Build and push Orchestrator image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.orchestrator
          platforms: linux/amd64,linux/arm64
          push: true
          tags: docker.io/marcb76/mandelbrok8s-orchestrator:latest

      # 7. Build and push Multi-Arch Worker image
      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.worker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: docker.io/marcb76/mandelbrok8s-worker:latest

      # 8. Install Oracle Cloud Infrastructure (OCI) CLI natively
      - name: Install OCI CLI
        run: |
          curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh -o install.sh
          bash install.sh --accept-all-defaults
          echo "$HOME/bin" >> $GITHUB_PATH

      # 9. Configure OCI credentials and private key securely
      - name: Configure OCI Credentials
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          
          cat << EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/oci_api_key.pem
          EOF

      # 10. Retrieve OKE cluster configuration and setup kubectl
      - name: Setup Kubeconfig for OKE
        run: |
          mkdir -p ~/.kube
          oci ce cluster create-kubeconfig \
            --cluster-id ${{ secrets.OCI_CLUSTER_OCID }} \
            --file ~/.kube/config \
            --region ${{ secrets.OCI_REGION }} \
            --token-version 2.0.0 \
            --kube-endpoint PUBLIC_ENDPOINT
          export KUBECONFIG=$HOME/.kube/config
          kubectl cluster-info

      # 11. Apply Kubernetes manifests to the OKE cluster
      - name: Deploy Manifests to OKE
        run: |
          export KUBECONFIG=$HOME/.kube/config
          
          # Ensure namespace is created first
          kubectl apply -f k8s/namespace.yaml
          
          # Apply all remaining deployments, services, HPA, and configurations
          kubectl apply -f k8s/
          
          # Verify the current state of the deployment
          kubectl get all -n mandelbrok8s
