apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator-sa
  namespace: mandelbrok8s
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orchestrator-read
  namespace: mandelbrok8s
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orchestrator-read
  namespace: mandelbrok8s
subjects:
  - kind: ServiceAccount
    name: orchestrator-sa
    namespace: mandelbrok8s
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orchestrator-read
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orchestrator-node-read
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: orchestrator-node-read
subjects:
  - kind: ServiceAccount
    name: orchestrator-sa
    namespace: mandelbrok8s
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: orchestrator-node-read
